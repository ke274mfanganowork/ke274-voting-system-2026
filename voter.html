<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter Portal | ISAAC Voting System</title>
  <style>
    :root {
      --navbar-height: 72px;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
      background: #064e3b;
    }

    /* Premium Deep-Green Navbar */
    .navbar {
      height: var(--navbar-height);
      background-color: #064e3b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid #10b981;
      position: relative;
      z-index: 100;
    }

    .navbar-brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.5px;
    }

    .navbar-brand span {
      color: #10b981; /* Subtle emerald accent */
    }

    .navbar-links {
      display: flex;
      gap: 1.5rem;
    }

    .navbar-links a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .navbar-links a:hover {
      color: #10b981;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .navbar {
        padding: 0 1rem;
        height: 64px;
      }
      
      :root {
        --navbar-height: 64px;
      }
    }

    /* Ballot Container */
    .ballot-container {
      width: 100%;
      height: calc(100vh - var(--navbar-height, 72px));
      min-height: 500px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .ballot-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #064e3b;
    }
  </style>
</head>
<body>

  <!-- 1. The Existing Navbar (Simplified & Premium Green Theme) -->
  <nav class="navbar">
    <a href="./index.html" class="navbar-brand">
      Mfangano <span>Voting</span>
    </a>
    <div class="navbar-links">
      <a href="./index.html">Home</a>
    </div>
  </nav>

  <!-- 2. Embedded External Ballot Application -->
  <main class="ballot-container">
    <iframe
      src="https://ke274-ballot-box.lovable.app"
      title="External ballot application"
      loading="eager"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

</body>
</html>
